name: build-m2d-wheelhouse

on:
  push:
    paths:
      - ".github/workflows/build-m2d-wheelhouse.yml"
  workflow_dispatch:

jobs:
  build-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - name: Set up exact Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"

      - name: Verify runtime
        run: |
          python --version
          python -c "import platform,sys; print(sys.version); print(platform.platform()); print(platform.machine())"

      - name: Upgrade pip tooling
        run: |
          python -m pip install --upgrade pip

      - name: Write frozen requirements
        run: |
          cat > runtime_requirements.txt <<'EOF'
          cloudpickle==3.1.2
          filelock==4.0.8
          fsspec==2026.9.0
          jinja2==3.1.6
          joblib==1.6.0
          markupsafe==3.0.3
          mpmath==1.3.0
          networkx==3.7
          numpy==2.3.5
          nvidia-nccl-cu12==2.32.3
          pandas==2.2.3
          python-dateutil==2.9.0.post0
          pytz==2026.4
          scikit-learn==1.8.0
          scipy==1.18.1
          setuptools==84.0.0
          six==1.17.0
          sympy==1.14.0
          threadpoolctl==3.7.0
          typing-extensions==4.16.0
          tzdata==2026.4
          xgboost==3.1.3
          EOF

      - name: Download exact PyPI wheels
        run: |
          mkdir -p wheelhouse
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse -r runtime_requirements.txt

      - name: Download exact PyTorch CPU wheel
        run: |
          python -m pip download --only-binary=:all: --no-deps --dest wheelhouse --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0+cpu"

      - name: Audit wheelhouse
        run: |
          python --version > WHEELHOUSE_AUDIT.txt
          echo "platform=$(uname -a)" >> WHEELHOUSE_AUDIT.txt
          echo "wheel_count=$(find wheelhouse -maxdepth 1 -type f -name '*.whl' | wc -l)" >> WHEELHOUSE_AUDIT.txt
          echo >> WHEELHOUSE_AUDIT.txt
          echo "[SHA256]" >> WHEELHOUSE_AUDIT.txt
          sha256sum wheelhouse/*.whl | sort >> WHEELHOUSE_AUDIT.txt
          echo >> WHEELHOUSE_AUDIT.txt
          echo "[FILES]" >> WHEELHOUSE_AUDIT.txt
          ls -lh wheelhouse | sort >> WHEELHOUSE_AUDIT.txt
          echo >> WHEELHOUSE_AUDIT.txt
          echo "[FROZEN_REQUIREMENTS]" >> WHEELHOUSE_AUDIT.txt
          cat runtime_requirements.txt >> WHEELHOUSE_AUDIT.txt
          cat WHEELHOUSE_AUDIT.txt

      - name: Split artifacts below connector limit
        run: |
          mkdir -p artifact_nccl artifact_torch_xgb artifact_rest
          mv wheelhouse/nvidia_nccl_cu12-*.whl artifact_nccl/
          mv wheelhouse/torch-*.whl artifact_torch_xgb/
          mv wheelhouse/xgboost-*.whl artifact_torch_xgb/
          mv wheelhouse/*.whl artifact_rest/
          for d in artifact_nccl artifact_torch_xgb artifact_rest; do
            cp runtime_requirements.txt WHEELHOUSE_AUDIT.txt "$d"/
            echo "$d bytes=$(du -sb "$d" | cut -f1)"
          done

      - name: Upload NCCL artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2d-python31214-wheelhouse-nccl
          path: artifact_nccl/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload Torch-XGBoost artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2d-python31214-wheelhouse-torch-xgb
          path: artifact_torch_xgb/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Upload remaining artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2d-python31214-wheelhouse-rest
          path: artifact_rest/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
